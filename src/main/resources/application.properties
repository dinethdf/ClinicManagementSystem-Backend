spring.application.name=ClinicManagementSystem

spring.security.userAuth.name=dineth
spring.security.userAuth.password=111


# ── Master Schema (tenant routing registry) ─────────────────────────────────
# clinicmsystem_master — contains only the clinics routing table
master.datasource.url=jdbc:mysql://localhost:3307/clinicmsystem_master?serverTimezone=Asia/Colombo
master.datasource.username=root
master.datasource.password=${DB_PASSWORD:@123}
master.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Shared Schema (existing DB — SHARED mode clinics) ────────────────────────
# All existing clinics use this by default (tenant_mode = SHARED)
spring.datasource.url=jdbc:mysql://localhost:3307/clinicmsystem?serverTimezone=Asia/Colombo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:@123}

# ── Tenant Schema Pool Settings (SCHEMA mode clinics) ────────────────────────
# Used by TenantDataSourcePool to dynamically create per-clinic HikariCP pools
tenant.datasource.host=localhost
tenant.datasource.port=3307
tenant.datasource.username=root
tenant.datasource.password=${DB_PASSWORD:@123}
tenant.datasource.pool.maximum-size=10
tenant.datasource.pool.minimum-idle=2
tenant.datasource.pool.idle-timeout=600000
tenant.datasource.pool.max-lifetime=1800000
tenant.datasource.pool.connection-timeout=20000

# 1. This logs the SQL query (like show-sql)
logging.level.org.hibernate.SQL=DEBUG
# 2. This logs the values that are bound to the '?' parameters
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


